name: Build Parallel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Parallel-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="parallel-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk --title "Parallel APK $GITHUB_RUN_NUMBER" --notes "Parallel Processing Android UI: local Qwen + execution kernel + Shizuku."
