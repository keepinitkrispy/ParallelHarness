name: Build Parallel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create persistent signing key if needed
        run: |
          mkdir -p signing-keys
          if [ ! -f signing-keys/debug.keystore ]; then
            keytool -genkeypair -v -keystore signing-keys/debug.keystore               -storepass android -alias androiddebugkey -keypass android               -dname "CN=Parallel,O=Ryan,C=US" -keyalg RSA -keysize 2048 -validity 10000
            git config user.name "parallel-build"
            git config user.email "parallel-build@users.noreply.github.com"
            git add signing-keys/debug.keystore
            git commit -m "Persist Parallel signing key [skip ci]"
            git push
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Parallel-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="parallel-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk             --title "Parallel APK $GITHUB_RUN_NUMBER"             --notes "Parallel Processing Android UI: local Qwen + execution kernel + Shizuku."
