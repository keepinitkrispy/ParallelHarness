name: Verify Native Coordinator

on:
  push:
    branches: [ "fix/native-coordinator-enforcement-20261030" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin and assemble isolated release candidate
        run: |
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin :app:assembleRelease --stacktrace
      - name: Verify generated APK signing
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: native-coordinator-candidate
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error