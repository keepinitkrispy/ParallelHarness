name: Ghost UI Fast
on:
  push:
    branches: [silent-cartographer-controls-models]
    paths:
      - 'runtime/ghost-ui-fast/**'
      - '.github/workflows/ghost-ui-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build fast bridge
        run: |
          mkdir -p runtime/ghost-ui-fast/classes runtime/ghost-ui-fast/dex
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-36/android.jar" -d runtime/ghost-ui-fast/classes runtime/ghost-ui-fast/GhostUI.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output runtime/ghost-ui-fast/dex runtime/ghost-ui-fast/classes/GhostUI.class
      - uses: actions/upload-artifact@v4
        with:
          name: Ghost-UI-Fast
          path: runtime/ghost-ui-fast/dex/classes.dex
          if-no-files-found: error
