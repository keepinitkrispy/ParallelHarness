name: Silent Cartographer Controls
on:
  push:
    branches:
      - silent-cartographer-controls-models
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          chmod +x gradlew
          ./gradlew :silentcartographer:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Silent-Cartographer-Controls
          path: silentcartographer/build/outputs/apk/debug/silentcartographer-debug.apk
          if-no-files-found: error
