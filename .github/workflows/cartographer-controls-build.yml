name: Silent Cartographer Controls
on:
  push:
    branches:
      - silent-cartographer-controls-models
  pull_request:
    branches:
      - silent-cartographer-controls-models
    paths:
      - 'runtime/cartographer-room/**'
      - 'silentcartographer/**'
      - '.github/workflows/cartographer-controls-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Silent Cartographer room behavior
        run: |
          python3 -m py_compile runtime/cartographer-room/twosome-server.py runtime/cartographer-room/test_room_models.py
          python3 -m unittest runtime/cartographer-room/test_room_models.py -v
      - run: |
          chmod +x gradlew
          ./gradlew :silentcartographer:assembleDebug --stacktrace
      - name: Build persistent fast UI bridges
        run: |
          mkdir -p runtime/ghost-ui-fast/classes runtime/ghost-ui-fast/dex
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-36/android.jar" -d runtime/ghost-ui-fast/classes runtime/ghost-ui-fast/GhostUI.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output runtime/ghost-ui-fast/dex runtime/ghost-ui-fast/classes/GhostUI.class
          mkdir -p runtime/ghost-ui-daemon/classes runtime/ghost-ui-daemon/dex
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-36/android.jar" -d runtime/ghost-ui-daemon/classes runtime/ghost-ui-daemon/GhostUIDaemon.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output runtime/ghost-ui-daemon/dex runtime/ghost-ui-daemon/classes/GhostUIDaemon.class
      - uses: actions/upload-artifact@v4
        with:
          name: Silent-Cartographer-Controls
          path: |
            silentcartographer/build/outputs/apk/debug/silentcartographer-debug.apk
            runtime/ghost-ui-fast/dex/classes.dex
            runtime/ghost-ui-daemon/dex/classes.dex
          if-no-files-found: error
