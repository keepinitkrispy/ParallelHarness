name: CSRE authority and Claude semantic judge tests

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/androidharness/app/tools/CsreAuthority.kt'
      - 'app/src/main/java/com/androidharness/app/tools/Tool.kt'
      - 'app/src/main/java/com/androidharness/app/agent/AgentEngine.kt'
      - 'app/src/main/java/com/androidharness/app/agent/ClaudeSemanticJudge.kt'
      - 'app/src/main/java/com/androidharness/app/HarnessApp.kt'
      - 'app/src/test/java/com/androidharness/app/tools/CsreAuthorityTest.kt'
      - 'app/src/test/java/com/androidharness/app/agent/ClaudeSemanticJudgeTest.kt'
      - '.github/workflows/csre-authority-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile app and run CSRE and Claude reviewer tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.androidharness.app.tools.CsreAuthorityTest' --tests 'com.androidharness.app.agent.ClaudeSemanticJudgeTest' --no-daemon
      - name: Assemble installable debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload ParallelHarness debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parallelharness-csre-claude-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
