name: Silent Cartographer Standalone

on:
  push:
    branches:
      - feature/silent-cartographer-standalone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify standalone target
        run: |
          test -f silentcartographer/src/main/AndroidManifest.xml
          grep -q 'compileSdk = 37' silentcartographer/build.gradle.kts
          grep -q 'versionName = "0.3.2"' silentcartographer/build.gradle.kts
      - name: Build standalone APK
        run: |
          chmod +x gradlew
          ./gradlew :silentcartographer:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Silent-Cartographer-0.3.2
          path: silentcartographer/build/outputs/apk/debug/silentcartographer-debug.apk
          if-no-files-found: error
