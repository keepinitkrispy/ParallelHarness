name: Silent Cartographer APK
on:
  push:
    branches:
      - silent-cartographer-build-20260927
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Extract source
        run: |
          mkdir -p scbuild
          tar -xzf .ci/SilentCartographerBuild-src.tgz -C scbuild
          rm -f scbuild/local.properties
          chmod +x scbuild/gradlew
      - name: Build APK
        working-directory: scbuild
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew --no-daemon --max-workers=4 :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SilentCartographer-debug-apk
          path: scbuild/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
