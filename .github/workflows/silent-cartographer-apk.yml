name: Silent Cartographer APK
on:
  push:
    branches:
      - silent-cartographer-build-20260927
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract source
        run: |
          mkdir -p scbuild
          tar -xzf .ci/SilentCartographerBuild-src.tgz -C scbuild
          rm -f scbuild/local.properties
          chmod +x scbuild/gradlew
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' scbuild/gradle.properties
      - name: Build APK
        working-directory: scbuild
        run: ./gradlew --no-daemon --max-workers=4 :silentcartographer:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SilentCartographer-debug-apk
          path: scbuild/silentcartographer/build/outputs/apk/debug/*.apk
          if-no-files-found: error
