name: Silent Cartographer Prototype Check

on:
  push:
    branches:
      - feature/silent-cartographer-ui

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check bridge syntax
        run: python3 -m py_compile scripts/gruesome-twosome/twosome-server
      - name: Compile prototype Kotlin
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin
